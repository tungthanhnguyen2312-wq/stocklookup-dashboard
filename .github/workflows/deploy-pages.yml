name: Deploy Pages

on:
  workflow_run:
    workflows: ["Dashboard CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Dashboard commit SHA that Dashboard CI already validated
        required: true
        type: string
      validated_ci_run_id:
        description: Dashboard CI run ID that completed SUCCESS for source_sha
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_sha || github.event.workflow_run.head_sha }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Validate manual dispatch against Dashboard CI
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          VALIDATED_CI_RUN_ID: ${{ github.event.inputs.validated_ci_run_id }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(printf '%s' "${SOURCE_SHA:-}" | tr -d '[:space:]')"
          VALIDATED_CI_RUN_ID="$(printf '%s' "${VALIDATED_CI_RUN_ID:-}" | tr -d '[:space:]')"
          if [ -z "$SOURCE_SHA" ]; then
            echo "ERROR: source_sha is empty"
            exit 1
          fi
          if ! [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "ERROR: source_sha is not a 40-character commit SHA: ${SOURCE_SHA}"
            exit 1
          fi
          if [ -z "$VALIDATED_CI_RUN_ID" ] || ! [[ "$VALIDATED_CI_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "ERROR: validated_ci_run_id is missing or not a run id: ${VALIDATED_CI_RUN_ID:-<empty>}"
            exit 1
          fi
          RUN_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${VALIDATED_CI_RUN_ID}")"
          run_id="$(jq -r '.id // empty' <<<"$RUN_JSON")"
          run_name="$(jq -r '.name // empty' <<<"$RUN_JSON")"
          run_status="$(jq -r '.status // empty' <<<"$RUN_JSON")"
          run_conclusion="$(jq -r '.conclusion // empty' <<<"$RUN_JSON")"
          run_branch="$(jq -r '.head_branch // empty' <<<"$RUN_JSON")"
          run_sha="$(jq -r '.head_sha // empty' <<<"$RUN_JSON")"
          if [ "$run_id" != "$VALIDATED_CI_RUN_ID" ]; then
            echo "ERROR: Actions run id mismatch observed=${run_id:-<empty>} expected=${VALIDATED_CI_RUN_ID}"
            exit 1
          fi
          if [ "$run_name" != "Dashboard CI" ]; then
            echo "ERROR: Actions run is not Dashboard CI: ${run_name:-<empty>}"
            exit 1
          fi
          if [ "$run_status" != "completed" ]; then
            echo "ERROR: Dashboard CI run is not completed: ${run_status:-<empty>}"
            exit 1
          fi
          if [ "$run_conclusion" != "success" ]; then
            echo "ERROR: Dashboard CI run did not succeed: ${run_conclusion:-<empty>}"
            exit 1
          fi
          if [ "$run_branch" != "main" ]; then
            echo "ERROR: Dashboard CI run head_branch is not main: ${run_branch:-<empty>}"
            exit 1
          fi
          if [ "$run_sha" != "$SOURCE_SHA" ]; then
            echo "ERROR: Dashboard CI head_sha ${run_sha:-<empty>} does not match source_sha ${SOURCE_SHA}"
            exit 1
          fi
          COMPARE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${SOURCE_SHA}...main")"
          compare_status="$(jq -r '.status // empty' <<<"$COMPARE_JSON")"
          if [ "$compare_status" != "identical" ] && [ "$compare_status" != "ahead" ]; then
            echo "ERROR: source_sha is not on current main release lineage (compare status=${compare_status:-<empty>})"
            exit 1
          fi
          echo "SOURCE_SHA=${SOURCE_SHA}" >> "$GITHUB_ENV"
          echo "MANUAL_DISPATCH_CI_GATE_PASS run_id=${VALIDATED_CI_RUN_ID} sha=${SOURCE_SHA} lineage=${compare_status}"

      - name: Checkout validated commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Assert source session coherence
        env:
          HEAD_SHA: ${{ env.SOURCE_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HEAD_SHA:-}" ]; then
            echo "ERROR: SOURCE_SHA is empty"
            exit 1
          fi
          CHECKED="$(git rev-parse HEAD)"
          if [ "$CHECKED" != "$HEAD_SHA" ]; then
            echo "ERROR: checked out ${CHECKED}, expected ${HEAD_SHA}"
            exit 1
          fi
          EXPECTED_SESSION="$(jq -r '.market_session // empty' data/build_info.json)"
          if [ -z "$EXPECTED_SESSION" ]; then
            echo "ERROR: data/build_info.json market_session is missing or empty"
            exit 1
          fi
          if ! [[ "$EXPECTED_SESSION" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "ERROR: data/build_info.json market_session is not YYYY-MM-DD: ${EXPECTED_SESSION}"
            exit 1
          fi
          echo "EXPECTED_SESSION=${EXPECTED_SESSION}"
          echo "HEAD_SHA=${HEAD_SHA}"
          assert_session() {
            local label="$1" observed="$2"
            if [ -z "$observed" ] || [ "$observed" != "$EXPECTED_SESSION" ]; then
              echo "ERROR: ${label} observed=${observed:-<empty>} expected=${EXPECTED_SESSION}"
              exit 1
            fi
          }
          assert_session "data/build_info.json market_session" \
            "$(jq -r '.market_session // empty' data/build_info.json)"
          assert_session "bundle_manifest.json freshness.reference_session" \
            "$(jq -r '.freshness.reference_session // empty' bundle_manifest.json)"
          assert_session "analysis_latest.json summary.session_date" \
            "$(jq -r '.summary.session_date // empty' analysis_latest.json)"
          SESSION_MANIFEST="data/session_${EXPECTED_SESSION//-/_}_manifest.json"
          SESSION_REPORT="report-${EXPECTED_SESSION}.html"
          FILES=(
            "data/build_info.json"
            "bundle_manifest.json"
            "analysis_latest.json"
            "screen_snapshot.csv"
            "market_breadth.csv"
            "$SESSION_MANIFEST"
            "$SESSION_REPORT"
            "dashboard.html"
            "investment-workspace.html"
            "portfolio.html"
            "data/workspace_index.json"
          )
          OPTIONAL_PUBLIC_FILES=(
            "data/screener_master_projection.json"
            "data/screener_master_projection.js"
          )
          for f in "${OPTIONAL_PUBLIC_FILES[@]}"; do
            if [ -s "$f" ]; then
              FILES+=("$f")
            fi
          done
          # DASHBOARD_PAYLOAD_COMPACTION_AND_INVESTOR_FIRST_IA_V1: detail shard filenames are
          # dynamic (one per populated ticker-first-letter bucket), so they cannot be statically
          # listed above -- discover whichever ones this publish actually produced.
          if [ -d "data/workspace_detail" ]; then
            while IFS= read -r -d '' shard; do
              FILES+=("${shard#./}")
            done < <(find data/workspace_detail -maxdepth 1 -name '*.json' -print0)
          fi
          if [ "$(find data/workspace_detail -maxdepth 1 -name '*.json' 2>/dev/null | wc -l)" -eq 0 ]; then
            echo "ERROR: data/workspace_detail has no shard files"
            exit 1
          fi
          for f in "${FILES[@]}"; do
            if [ ! -s "$f" ]; then
              echo "ERROR: missing or empty source file: $f"
              exit 1
            fi
          done
          assert_session "${SESSION_MANIFEST} dashboard_session" \
            "$(jq -r '.dashboard_session // empty' "$SESSION_MANIFEST")"
          echo "SOURCE_SESSION_COHERENCE_PASS"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # SUCCESS requires the public origin to serve this commit's bytes, not merely
      # that the deploy-pages action returned. GitHub Pages CDN can lag; retry is bounded.
      - name: Verify public Pages bytes
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          HEAD_SHA: ${{ env.SOURCE_SHA }}
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          if [ -z "${PAGE_URL:-}" ]; then
            echo "ERROR: steps.deployment.outputs.page_url is empty"
            exit 1
          fi
          if [ -z "${HEAD_SHA:-}" ]; then
            echo "ERROR: SOURCE_SHA is empty"
            exit 1
          fi
          PAGE_URL="${PAGE_URL%/}"
          EXPECTED_SESSION="$(jq -r '.market_session // empty' data/build_info.json)"
          if [ -z "$EXPECTED_SESSION" ]; then
            echo "ERROR: data/build_info.json market_session is missing or empty"
            exit 1
          fi
          if ! [[ "$EXPECTED_SESSION" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "ERROR: data/build_info.json market_session is not YYYY-MM-DD: ${EXPECTED_SESSION}"
            exit 1
          fi
          SESSION_MANIFEST="data/session_${EXPECTED_SESSION//-/_}_manifest.json"
          SESSION_REPORT="report-${EXPECTED_SESSION}.html"
          if [ "$(jq -r '.freshness.reference_session // empty' bundle_manifest.json)" != "$EXPECTED_SESSION" ]; then
            echo "ERROR: bundle_manifest.json freshness.reference_session mismatch"
            exit 1
          fi
          if [ "$(jq -r '.summary.session_date // empty' analysis_latest.json)" != "$EXPECTED_SESSION" ]; then
            echo "ERROR: analysis_latest.json summary.session_date mismatch"
            exit 1
          fi
          if [ ! -s "$SESSION_MANIFEST" ]; then
            echo "ERROR: missing or empty source file: ${SESSION_MANIFEST}"
            exit 1
          fi
          if [ "$(jq -r '.dashboard_session // empty' "$SESSION_MANIFEST")" != "$EXPECTED_SESSION" ]; then
            echo "ERROR: ${SESSION_MANIFEST} dashboard_session mismatch"
            exit 1
          fi
          FILES=(
            "data/build_info.json"
            "bundle_manifest.json"
            "analysis_latest.json"
            "screen_snapshot.csv"
            "market_breadth.csv"
            "$SESSION_MANIFEST"
            "$SESSION_REPORT"
            "dashboard.html"
            "investment-workspace.html"
            "portfolio.html"
            "data/workspace_index.json"
          )
          OPTIONAL_PUBLIC_FILES=(
            "data/screener_master_projection.json"
            "data/screener_master_projection.js"
          )
          for f in "${OPTIONAL_PUBLIC_FILES[@]}"; do
            if [ -s "$f" ]; then
              FILES+=("$f")
            fi
          done
          # Codex F4: build_info.js always; when the candlestick component is CURRENT, its JSON/JS
          # pair (canonical parity + attested projection/snapshot identity) and the renderer entry
          # points. A local binding mismatch refuses before any public claim.
          if ! CANDLE_PROOF="$(node tools/verify_candlestick_release_binding.cjs . --proof-files)"; then
            echo "ERROR: candlestick release binding refused"
            exit 1
          fi
          while IFS= read -r f; do
            if [ -n "$f" ]; then
              FILES+=("$f")
            fi
          done <<< "$CANDLE_PROOF"
          # Detail shard filenames are dynamic -- verify whichever ones this publish produced,
          # not a fixed guess, against the live served bytes below.
          if [ -d "data/workspace_detail" ]; then
            while IFS= read -r -d '' shard; do
              FILES+=("${shard#./}")
            done < <(find data/workspace_detail -maxdepth 1 -name '*.json' -print0)
          fi
          WORKDIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/pages-verify.XXXXXX")"
          trap 'rm -rf "$WORKDIR"' EXIT
          mkdir -p "$WORKDIR/expected" "$WORKDIR/observed"
          keyify() { printf '%s' "$1" | tr '/\\' '__'; }
          for f in "${FILES[@]}"; do
            if [ ! -s "$f" ]; then
              echo "ERROR: missing or empty source file: $f"
              exit 1
            fi
            sha256sum -- "$f" | awk '{print $1}' > "$WORKDIR/expected/$(keyify "$f")"
            if [ ! -s "$WORKDIR/expected/$(keyify "$f")" ]; then
              echo "ERROR: could not hash source file: $f"
              exit 1
            fi
          done
          MAX_ATTEMPTS=12
          SLEEP_SECONDS=10
          echo "EXPECTED_SESSION=${EXPECTED_SESSION}"
          echo "HEAD_SHA=${HEAD_SHA}"
          echo "PAGE_URL=${PAGE_URL}"
          echo "MAX_ATTEMPTS=${MAX_ATTEMPTS}"
          echo "SLEEP_SECONDS=${SLEEP_SECONDS}"
          attempt=1
          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            echo "Public byte verification attempt ${attempt}/${MAX_ATTEMPTS}"
            all_ok=1
            for f in "${FILES[@]}"; do
              key="$(keyify "$f")"
              tmp="$WORKDIR/observed/${key}"
              url="${PAGE_URL}/${f}"
              http_code="000"
              if ! http_code="$(curl -sS -L --connect-timeout 5 --max-time 15 \
                  -H "Cache-Control: no-cache" \
                  -H "Pragma: no-cache" \
                  -o "$tmp" \
                  -w "%{http_code}" \
                  "${url}?verify=${HEAD_SHA}-${attempt}")"; then
                http_code="${http_code:-000}"
              fi
              if [ "$http_code" != "200" ]; then
                printf 'HTTP %s\n' "$http_code" > "$WORKDIR/observed/${key}.result"
                all_ok=0
                echo "  ${f}: HTTP ${http_code}"
                continue
              fi
              public_sha="$(sha256sum -- "$tmp" | awk '{print $1}')"
              expected_sha="$(cat "$WORKDIR/expected/${key}")"
              if [ "$public_sha" != "$expected_sha" ]; then
                printf '%s\n' "$public_sha" > "$WORKDIR/observed/${key}.result"
                all_ok=0
                echo "  ${f}: SHA mismatch expected=${expected_sha} observed=${public_sha}"
                continue
              fi
              printf '%s\n' "$public_sha" > "$WORKDIR/observed/${key}.result"
              echo "  ${f}: OK"
            done
            if [ "$all_ok" -eq 1 ]; then
              echo "PUBLIC_BYTE_IDENTITY_PASS attempt=${attempt} session=${EXPECTED_SESSION} sha=${HEAD_SHA}"
              exit 0
            fi
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              sleep "$SLEEP_SECONDS"
            fi
            attempt=$((attempt + 1))
          done
          echo "PUBLIC_BYTE_IDENTITY_FAIL after ${MAX_ATTEMPTS} attempts"
          echo "EXPECTED_SESSION=${EXPECTED_SESSION}"
          echo "HEAD_SHA=${HEAD_SHA}"
          echo "PAGE_URL=${PAGE_URL}"
          for f in "${FILES[@]}"; do
            key="$(keyify "$f")"
            echo "file=${f}"
            echo "  expected_sha256=$(cat "$WORKDIR/expected/${key}")"
            if [ -s "$WORKDIR/observed/${key}.result" ]; then
              echo "  observed=$(cat "$WORKDIR/observed/${key}.result")"
            else
              echo "  observed=<none>"
            fi
            echo "  attempts=${MAX_ATTEMPTS}"
          done
          exit 1
