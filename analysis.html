<!doctype html>
<html lang="vi" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chuyển hướng sang Cơ hội | Stock Lookup</title>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search || "");
      params.set("view", "analysis");
      var hash = window.location.hash || "";
      window.location.replace("investment-workspace.html?" + params.toString() + hash);
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css?v=2026-11-06-3b70d40-83af117486">
  <link rel="stylesheet" href="assets/css/shell.css?v=2026-11-06-3b70d40-83af117486">
</head>
<body class="bg-bg text-white" data-page="analysis">
  <div class="container py-5 text-center" style="max-width: 640px;">
    <div class="mb-4">
      <span class="badge-soft bs-amber mb-2 d-inline-block">Cơ hội</span>
      <h1 class="h3 mb-2">Phân tích đã được hợp nhất</h1>
      <p class="text-muted">Trang Phân tích đa trục cũ đã được tích hợp hoàn toàn làm chế độ xem <strong>Phân tích</strong> bên trong <strong>Cơ hội</strong> .</p>
    </div>
    <div class="cockpit-warning mb-4">
      Chỉ phục vụ nghiên cứu có người kiểm tra. Không tạo giá mục tiêu, khuyến nghị, xác suất, quy mô vị thế hoặc chỉ thị giao dịch.
    </div>
    <div class="mb-4">
      <a id="redirect-link" href="investment-workspace.html?view=analysis" class="btn btn-primary px-4 py-2">Chuyển sang Cơ hội &rarr;</a>
    </div>
    <noscript>
      <div class="alert alert-warning text-start">
        Trình duyệt của bạn đang tắt JavaScript. Vui lòng bấm vào liên kết trên để chuyển sang Cơ hội.
      </div>
    </noscript>
    <script>
      (function() {
        var link = document.getElementById("redirect-link");
        if (link) {
          var params = new URLSearchParams(window.location.search || "");
          params.set("view", "analysis");
          link.href = "investment-workspace.html?" + params.toString() + (window.location.hash || "");
        }
      })();
    </script>
  </div>
  <script src="assets/js/value-format.js?v=2026-11-06-3b70d40-83af117486"></script>
</body>
</html>
